[project]
name = "discogs2ytmusic"
version = "0.1.0"
description = "Sync a Discogs collection to YouTube Music playlists, grouped by style tag."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.11.7",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "typer>=0.27.2",
    "yt-dlp>=2026.8.19",
    "ytmusicapi>=1.12.2",
]

[project.scripts]
discogs2ytmusic = "discogs2ytmusic.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discogs2ytmusic"]
